<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    // --- SETUP: Put your free Gemini API Key here ---
    // Get a free key from: https://aistudio.google.com/app/apikey
    const AI_API_KEY = "AQ.Ab8RN6JXx4mTnra9vRr0Hq9FvL9wsYUd097bc0hnlCHahkwPzw"; 

    // Scale canvas for preview
    function resizeCanvasPreview() {
        const wrapper = document.getElementById('wrapper');
        const canvas = document.getElementById('post-canvas');
        const scale = wrapper.clientWidth / 1080;
        canvas.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeCanvasPreview);
    resizeCanvasPreview();

    // Map inputs to footer
    function updateLivePreview() {
        document.getElementById('out-name').innerText = document.getElementById('in-name').value || "Doctor Name";
        document.getElementById('out-degree').innerText = document.getElementById('in-degree').value || "Degrees";
        document.getElementById('out-phone').innerText = document.getElementById('in-phone').value || "Contact";
        document.getElementById('out-address').innerText = document.getElementById('in-address').value || "Address";
    }

    // Helper to render lists in the UI
    const renderList = (id, items) => {
        const ul = document.getElementById(id);
        ul.innerHTML = ""; 
        items.forEach(item => {
            const li = document.createElement('li');
            li.innerText = item;
            ul.appendChild(li);
        });
    };

    // ----------------------------------------------------
    // REAL LIVE AI INTEGRATION (Google Gemini API)
    // ----------------------------------------------------
    async function generateAIPost() {
        const topicInput = document.getElementById('in-topic').value.trim();
        if(!topicInput) return alert("Please enter a disease or topic.");

        const btn = document.querySelector('.btn-ai');
        const originalBtnText = btn.innerHTML;
        
        // Change button to loading state
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> AI is thinking...';
        btn.disabled = true;

        // Update Title immediately
        document.getElementById('out-topic').innerText = topicInput.toUpperCase();

        // The strict prompt instructing the AI to only return JSON data
        const promptText = `Act as a professional medical expert. Provide exactly 4 short symptoms, 4 short causes, and 4 short precautions for the medical topic: "${topicInput}". Return ONLY a valid JSON object in this exact format: {"symptoms":["","","",""],"causes":["","","",""],"precautions":["","","",""]}. Do not include any other text or markdown formatting.`;

        try {
            if(AI_API_KEY === "YOUR_API_KEY_HERE") {
                throw new Error("API Key is missing. Please add your key to the code.");
            }

            // Call the AI API
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${AI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const result = await response.json();
            
            if (result.error) throw new Error(result.error.message);

            // Extract the text response from the AI
            let aiText = result.candidates[0].content.parts[0].text;
            
            // Clean up the text in case the AI added markdown (```json ... ```)
            aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
            
            // Convert text to a JavaScript Object
            const data = JSON.parse(aiText);

            // Render the fetched data into the Infographic
            renderList('list-symptoms', data.symptoms || ["N/A", "N/A", "N/A", "N/A"]);
            renderList('list-causes', data.causes || ["N/A", "N/A", "N/A", "N/A"]);
            renderList('list-precautions', data.precautions || ["N/A", "N/A", "N/A", "N/A"]);

            // Replay CSS Animations
            const postElement = document.getElementById('post-canvas');
            postElement.classList.remove('animate');
            void postElement.offsetWidth; // Trigger reflow
            postElement.classList.add('animate');

        } catch (error) {
            console.error("AI Error:", error);
            alert("Failed to generate AI content: " + error.message);
        } finally {
            // Restore button state
            btn.innerHTML = originalBtnText;
            btn.disabled = false;
        }
    }

    // ----------------------------------------------------
    // HD DOWNLOAD FUNCTION (Fixes Blur & White Spaces)
    // ----------------------------------------------------
    function downloadHD() {
        const postCanvas = document.getElementById('post-canvas');
        const btn = document.getElementById('download-btn');
        
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
        btn.disabled = true;

        const originalTransform = postCanvas.style.transform;
        const originalPosition = postCanvas.style.position;
        const originalZIndex = postCanvas.style.zIndex;

        postCanvas.style.transform = 'scale(1)';
        postCanvas.style.position = 'fixed';
        postCanvas.style.top = '0';
        postCanvas.style.left = '0';
        postCanvas.style.zIndex = '-9999'; 

        setTimeout(() => {
            html2canvas(postCanvas, {
                scale: 2,               
                useCORS: true,          
                allowTaint: true,       
                backgroundColor: '#ffffff',
                width: 1080,            
                height: 1080,           
                scrollX: 0,             
                scrollY: 0              
            }).then(canvas => {
                postCanvas.style.position = originalPosition;
                postCanvas.style.zIndex = originalZIndex;
                postCanvas.style.transform = originalTransform;
                
                const link = document.createElement('a');
                const topic = document.getElementById('in-topic').value || "Post";
                link.download = `${topic}_Doctor_Post.png`;
                link.href = canvas.toDataURL('image/png', 1.0); 
                link.click();

                btn.innerHTML = '<i class="fa-solid fa-download"></i> Download HD Post';
                btn.disabled = false;
            }).catch(err => {
                console.error("Capture Error: ", err);
                btn.innerHTML = '<i class="fa-solid fa-download"></i> Download HD Post';
                btn.disabled = false;
            });
        }, 150); 
    }

    // Run once on load to populate footer
    updateLivePreview();
</script>
